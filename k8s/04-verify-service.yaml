apiVersion: apps/v1
kind: Deployment
metadata:
  name: verify-service
  namespace: certiflow
spec:
  replicas: 2
  selector:
    matchLabels: {app: verify-service}
  template:
    metadata:
      labels: {app: verify-service}
    spec:
      containers:
        - name: verify-service
          image: certiflow/verify-service:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5002}]
          envFrom:
            - configMapRef: {name: certiflow-config}
            - secretRef: {name: certiflow-secret}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 5002}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5002}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: verify-service
  namespace: certiflow
spec:
  selector: {app: verify-service}
  ports: [{port: 5002, targetPort: 5002}]
