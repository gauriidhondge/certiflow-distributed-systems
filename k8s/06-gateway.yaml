apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: certiflow
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: certiflow/gateway:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: certiflow-config}}]
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: certiflow
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30090
