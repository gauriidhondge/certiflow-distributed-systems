apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: certiflow
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: certiflow/worker:1.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: certiflow-config}
            - secretRef: {name: certiflow-secret}
          resources:
            requests: {cpu: 100m, memory: 96Mi}   # HPA % is measured against this
            limits: {cpu: 500m, memory: 256Mi}
